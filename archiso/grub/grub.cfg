set timeout=5
set default=0

# Cosmetic — Aite OS branding for the grub menu.
loadfont unicode

if loadfont unicode ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxpayload=keep
    terminal_input console
    terminal_output gfxterm
fi

# Note: text-mode menu still works on systems where no GFX framebuffer is
# available, so we don't gate the menu entries on the cosmetic block above.

set theme=/boot/grub/themes/aite/theme.txt 2>/dev/null
export theme

menuentry "Boot Aite OS (Live, copy to RAM)" --class aite --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram cow_spacesize=1G quiet splash loglevel=3
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Boot Aite OS (Live, run from disk)" --class aite --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Boot Aite OS (Safe graphics)" --class aite --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry 'UEFI Firmware Settings' --class efi {
        fwsetup
    }
fi

menuentry "Reboot" --class restart {
    reboot
}

menuentry "Power off" --class shutdown {
    halt
}
