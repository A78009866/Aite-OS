## Aite OS — kernel tuning for low-RAM live system

# Strongly prefer compressed swap (zram) over evicting pages, which keeps the
# desktop responsive on a 2 GB machine.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Reduce dirty page accumulation to avoid write storms on slow USB media.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Reasonable defaults for a desktop kernel.
kernel.sysrq = 1
fs.inotify.max_user_watches = 524288
