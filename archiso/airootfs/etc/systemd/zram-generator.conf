## Aite OS — zram swap configuration
##
## On a 2 GB machine this gives effective ~3 GB usable memory at the cost of
## a tiny amount of CPU. zram is compressed RAM used as swap; under pressure
## the kernel transparently compresses cold pages instead of evicting them.

[zram0]
zram-size = min(ram / 2, 2048)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
