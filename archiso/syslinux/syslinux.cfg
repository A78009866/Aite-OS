DEFAULT aite-main
TIMEOUT 50
PROMPT 0

UI vesamenu.c32
MENU TITLE Aite OS
MENU BACKGROUND splash.png
MENU CLEAR
MENU IMMEDIATE
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

LABEL aite-main
    MENU LABEL Boot Aite OS (^Live, copy to RAM)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram cow_spacesize=1G quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3

LABEL aite-disk
    MENU LABEL Boot Aite OS (Live, ^run from disk)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3

LABEL aite-safe
    MENU LABEL Boot Aite OS (^Safe graphics, no copytoram)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset i915.modeset=0 nouveau.modeset=0 radeon.modeset=0 amdgpu.modeset=0

LABEL existing
    MENU LABEL Boot ^existing OS
    COM32 chain.c32
    APPEND hd0 0

LABEL memtest
    MENU LABEL Run ^Memtest86+ (RAM test)
    LINUX /boot/memtest86+/memtest.bin

LABEL hdt
    MENU LABEL ^Hardware Information (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power Off
    COM32 poweroff.c32
